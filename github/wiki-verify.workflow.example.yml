# harness-tier wiki-verify CI — copied as-is by /flow-init (no config tokens).
# Layer-3 safety net for the LLM Wiki: the layer-2 wiki gate sees only Claude-session commits,
# so graph drift arriving via terminal/direct/CI commits would otherwise surface only at the
# next session commit — here it fails the push/PR instead. Read-only: CI never builds
# graph.yaml (doc-sync and /wiki-init own --build).
# Rendered unconditionally: with no wiki installed (flow-config.wiki absent or enable: false)
# wiki_graph.py --verify exits 0 silently, so the job is green — which keeps /flow-init
# independent of whether /wiki-init has run yet. The same holds when the script is not in the
# checkout (a repo that gitignores .claude/), which the step's own guard covers.
name: wiki-verify

on:
  push:
  pull_request:

jobs:
  wiki-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Verify wiki graph
        # The guard is the other half of the unconditional render: a repo that gitignores
        # .claude/ has no script in the checkout at all, and python3 would exit 2 on the
        # missing file — red on every push, for a repo that never opted into a wiki.
        run: |
          if [ ! -f .claude/harness-tier/scripts/wiki_graph.py ]; then
            echo "no wiki_graph.py in the checkout - nothing to verify"
            exit 0
          fi
          python3 .claude/harness-tier/scripts/wiki_graph.py --verify
