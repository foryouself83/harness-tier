# Branch naming validation (Git-flow). Rendered by /flow-init. push trigger (compatible with projects not using PRs).
name: branch-naming

on:
  push:
    # A tag push names the tag in github.ref_name; a branches filter alone leaves tags out.
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Checking: $BRANCH"
          # Configured branch names compare as strings: a name is not a pattern.
          for b in "__HARNESS_INTEGRATION__" "__HARNESS_PRERELEASE__" "__HARNESS_STABLE__"; do
            if [ "$BRANCH" = "$b" ]; then echo "matches: $b"; exit 0; fi
          done
          # dependabot/ and renovate/ are where those bots push their update branches.
          PATTERNS=(
            "^feature/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^fix/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^docs/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^hotfix/[a-zA-Z0-9][a-zA-Z0-9._/-]*$"
            "^release/[0-9]+\.[0-9]+\.[0-9]+$"
            "^dependabot/.+$"
            "^renovate/.+$"
          )
          for p in "${PATTERNS[@]}"; do
            if [[ "$BRANCH" =~ $p ]]; then echo "matches: $p"; exit 0; fi
          done
          echo "Invalid branch name: $BRANCH"; exit 1
