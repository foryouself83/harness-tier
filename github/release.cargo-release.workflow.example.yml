# Release (Rust, cargo-release) — rendered by /flow-init from flow-config.versioning.
# cargo-release natively bumps Cargo.toml, commits, tags, and pushes — but (verified against
# crate-ci/cargo-release docs) it does not derive patch/minor/major from Conventional Commits;
# the level is a required argument. The stable branch reads the level from the same
# `Release-Level: major|minor|patch` commit trailer the `/release-commit` staging-bump step
# writes (default: patch). The prerelease branch instead consumes `$NEXT` from the shared
# next-version block (AUTO_LEVEL is `""` there, not `patch`): only an explicit `Release-Level`
# trailer resolves `$NEXT` to a concrete `X.Y.Z-rc.N`, applied via cargo-release's own
# `[version]` positional (a valid semver string is a documented accepted value, per crate-ci's
# reference). With no trailer, `$NEXT` stays `auto` regardless of any pending rc train — an
# empty AUTO_LEVEL never supplies a fallback level — and cargo-release's own `rc` level
# continues or starts the prerelease train itself.
# `rc`/`release` are real cargo-release levels (not fabricated here): `rc` bumps/continues a
# `-rc.N` prerelease train, `release` strips an existing prerelease suffix back to stable.
# `--no-publish` is intentional: publishing to crates.io is a bigger, separate decision than
# tagging on GitHub — remove it once the crate is ready for that (see commit-versioning-guide.md).
# cargo-release does not create a GitHub Release (only the git tag) — added as a final step.
# Auth: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }} (falls back to GITHUB_TOKEN when unset).
name: release

on:
  push:
    branches: [__HARNESS_STABLE__, __HARNESS_PRERELEASE__]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      tag: ${{ steps.exposetag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No `ref:` — on `push` actions/checkout already attaches HEAD to the triggering
          # branch (`checkout --force -B <branch>`), which is what cargo-release's default
          # `allow-branch` needs to commit and push. Pinning `ref:` would resolve the branch
          # tip instead of the commit that triggered the run.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-release
        run: cargo install cargo-release
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: cargo release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          HARNESS_SCRIPTS: .claude/harness-tier/scripts
          AUTO_LEVEL: ""
        run: |
          LEVEL="$(git log -1 --pretty=%B | sed -nE 's/^Release-Level:[[:space:]]*(major|minor|patch)[[:space:]]*$/\1/p' | head -1)"
          LEVEL="${LEVEL:-patch}"
          BEFORE="$(git rev-parse HEAD)"
          if [ "$REF_NAME" = "__HARNESS_PRERELEASE__" ]; then
            # >>> next-version (shared by every release workflow; tests/release_level pins it)
            git fetch --tags --force --quiet origin || true
            NEXT="$(python3 "$HARNESS_SCRIPTS/bump_version.py" next \
              --message "$(git log -1 --pretty=%B)" \
              --tags "$(git tag --list)" \
              --auto-level "${AUTO_LEVEL:-}")" || exit 1
            echo "next version: $NEXT"
            # <<< next-version
            if [ "$NEXT" = "auto" ]; then
              cargo release rc --execute --no-confirm --no-publish
            else
              cargo release "$NEXT" --execute --no-confirm --no-publish
            fi
          else
            # `cargo metadata` (not a Cargo.toml read) so an inherited `version.workspace =
            # true` comes back already resolved to a string by cargo itself. A missing/non-
            # string version or a failing `cargo metadata` is a hard error (cargo release
            # would fail on the same manifest too). Independently versioned workspace
            # members are not an error — that already released before this task — so that
            # case only warns and leaves CARGO_VERSION empty; only the prerelease check
            # below decides whether the guard runs, never the member count.
            CARGO_METADATA="$(cargo metadata --no-deps --format-version 1)" || exit 1
            CARGO_VERSION="$(printf '%s' "$CARGO_METADATA" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          members = set(data["workspace_members"])
          pkgs = [p for p in data["packages"] if p["id"] in members]
          if not pkgs:
              sys.stderr.write("::error::cargo metadata reported no workspace members\n")
              sys.exit(1)
          versions = []
          for p in pkgs:
              v = p.get("version")
              if not isinstance(v, str) or not v:
                  sys.stderr.write(
                      "::error::cargo metadata did not report a version string for %s\n"
                      % p.get("name", "<unknown>")
                  )
                  sys.exit(1)
              versions.append(v)
          distinct = sorted(set(versions))
          if len(distinct) != 1:
              sys.stderr.write(
                  "::warning::finalize guard skipped - workspace members carry %d "
                  "different versions (independently versioned); release proceeds "
                  "without a tag-existence check\n" % len(distinct)
              )
              sys.exit(0)
          print(distinct[0])
            ')" || exit 1
            if [ -n "$CARGO_VERSION" ]; then
              STABLE="$(python3 "$HARNESS_SCRIPTS/bump_version.py" finalize --current "$CARGO_VERSION" || true)"
              if [ -n "$STABLE" ]; then
                # >>> finalize-guard (shared by every release workflow; tests/release_level pins it)
                if git rev-parse -q --verify "refs/tags/v$STABLE" >/dev/null; then
                  echo "::error::v$STABLE already exists — a hotfix shipped this base. Re-promote staging with Release-Level: patch (or higher) before releasing." >&2
                  exit 1
                fi
                LATEST_STABLE="$(git tag --list 'v*' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n 1)"
                if [ -n "$LATEST_STABLE" ] && [ "$(printf '%s\n%s\n' "$LATEST_STABLE" "$STABLE" | sort -V | tail -n 1)" != "$STABLE" ]; then
                  echo "::error::v$STABLE is below the latest release v$LATEST_STABLE — a hotfix shipped a higher base, so finalizing would downgrade. Re-promote staging with Release-Level: patch (or higher) before releasing." >&2
                  exit 1
                fi
                # <<< finalize-guard
              fi
            fi
            # Finalize an in-flight rc train; if there is none to finalize, do a fresh bump.
            cargo release release --execute --no-confirm --no-publish \
              || cargo release "$LEVEL" --execute --no-confirm --no-publish
          fi
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create GitHub Release
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          PRERELEASE=""
          [ "$REF_NAME" = "__HARNESS_PRERELEASE__" ] && PRERELEASE="--prerelease"
          gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE

      - name: Expose released tag
        id: exposetag
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Stable release notes from CHANGELOG
        if: ${{ github.ref_name == '__HARNESS_STABLE__' && steps.exposetag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          HARNESS_SCRIPTS: .claude/harness-tier/scripts
          TAG: ${{ steps.exposetag.outputs.tag }}
        run: |
          # >>> release-notes (shared by every release workflow; tests/release_level pins it)
          if python3 "$HARNESS_SCRIPTS/changelog_section.py" extract --version "${TAG#v}" > stable-notes.md; then
            gh release edit "$TAG" --notes-file stable-notes.md \
              || echo "::warning::could not replace the $TAG release notes with its CHANGELOG section"
          else
            echo "no stable ${TAG} section in CHANGELOG.md — keeping the release notes as created"
          fi
          # <<< release-notes

  # __HARNESS_DEPLOY_BEGIN__ (managed by /harness-deployments · /flow-init — do not edit inside)
  # __HARNESS_DEPLOY_END__
