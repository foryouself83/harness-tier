# Deploy (Maven Central) — reusable component (workflow_call) invoked by deploy.yml's orchestrator,
# or run manually via workflow_dispatch. Builds and deploys to Central. Requires
# MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Central portal token) and, for signed artifacts,
# MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE.
name: deploy-maven-central

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: deploy-maven-central-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: __HARNESS_TIMEOUT__
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "__HARNESS_VERSION__"
          # Writes the settings.xml server entry `mvn deploy` authenticates with. `central` is
          # the central-publishing-maven-plugin's default publishingServerId; a pom that names
          # another server needs that id here.
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          # Empty when the secret is unset, which imports no key and leaves signing to fail.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Build package
        run: __HARNESS_BUILD__
      - name: Deploy to Maven Central
        run: mvn -B -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
